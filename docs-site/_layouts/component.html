---
layout: blank
---

<hf-responsive-sidebar >
  {%- include header-nav.html -%}
  <component-list-sidebar current="{{page.url | remove_first: '/' | split: '/' | last | replace: '.html', '' }}" class=p0 slot=sidebar></component-list-sidebar>
<div slot=main>
  <h1>{{ page.title }}</h1>
  <h3>{{ page.sub-title }}</h3>
  <ui-repl>
    <textarea readonly slot="markup" placeholder="Enter HTML ...">{{content}}</textarea>
    <div slot=preview>{{content}}</div>
  </ui-repl>
  {{ page.description | markdownify }}
</div>
</hf-responsive-sidebar>
