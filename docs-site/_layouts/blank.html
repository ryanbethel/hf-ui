<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>
    {{ content }}

    {% if page.script %}
      <script type="module" src="{{ page.script }}"></script>
    {% endif %}
    
    {% if page.scripts %}
      {% for script in page.scripts %}
        <script type="module" src="{{ script }}"></script>
      {% endfor %}
    {% endif %}
  </body>

</html>
