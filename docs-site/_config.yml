title: HF-UI HTML First SSR/CSR Components
email: ryan.bethel@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
    HF-UI HTML first components are universal server side and client side rendered web components for use in any framework or <hf-h-rule></hf-h-rule>programming language. They are dependency free and easy to use.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jekyllrb
github_username:  jekyll

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - scripts
  - package.json
  - package-lock.json
  - node_modules/
  - .jekyll-build
  - _site
  - _elements/
  - _scripts/

# Default exclude list:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
